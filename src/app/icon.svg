  <rect x="11.5" y="17" width="4" height="2" rx="1" fill="white"/>
  <!-- Simplified petrol pump (right, white) — body + screen + nozzle -->
  <rect x="18" y="9" width="7" height="10" rx="1" fill="none" stroke="white" stroke-width="1"/>
  <rect x="19.5" y="10.5" width="4" height="2.5" rx="0.5" fill="white" fill-opacity="0.4"/>
  <path d="M25 12 L27 12 L27 15 L26 15" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="18" y="18.5" width="7" height="1.5" rx="0.75" fill="white" fill-opacity="0.6"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="15" stroke="#0B132B" stroke-width="1" fill="none"/>
  <!-- Centre divider -->
  <line x1="16" y1="1" x2="16" y2="31" stroke="white" stroke-width="1" stroke-opacity="0.45"/>
</svg>
