<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ElectricVsPetrol.co.uk</title>
  <!-- Left half: electric blue -->
  <path d="M32 2 A30 30 0 0 0 32 62 Z" fill="#0066FF"/>
  <!-- Right half: deep navy -->
  <path d="M32 2 A30 30 0 0 1 32 62 Z" fill="#0B132B"/>
  <!-- EV Type 2 connector (left, white) -->
  <!-- Housing -->
  <path d="M8 23 C8 19 11 16 15 16 L19 16 C23 16 26 19 26 23 L26 33 C26 37 23 38 19 38 L15 38 C11 38 8 37 8 33 Z"
        stroke="white" stroke-width="1.4" fill="white" fill-opacity="0.18"/>
  <!-- 7 pin holes -->
  <circle cx="13" cy="22"   r="1.5" fill="white"/>
  <circle cx="17" cy="20.5" r="1.5" fill="white"/>
  <circle cx="21" cy="22"   r="1.5" fill="white"/>
  <circle cx="13" cy="27.5" r="1.5" fill="white"/>
  <circle cx="21" cy="27.5" r="1.5" fill="white"/>
  <circle cx="15" cy="33"   r="1.2" fill="white"/>
  <circle cx="19" cy="33"   r="1.2" fill="white"/>
  <!-- Handle + cable -->
  <rect x="13.5" y="38" width="7" height="3"  rx="1.5" fill="white"/>
  <rect x="15.5" y="41" width="3" height="5"  rx="1.5" fill="white"/>
  <!-- Petrol pump (right, white) -->
  <!-- Body -->
  <rect x="38" y="17" width="13" height="21" rx="2"
        stroke="white" stroke-width="1.4" fill="white" fill-opacity="0.1"/>
  <!-- Screen -->
  <rect x="40" y="20" width="9" height="6" rx="1" fill="white" fill-opacity="0.35"/>
  <!-- Nozzle arm -->
  <path d="M51 22 L55 22 L55 28 L53 28"
        stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Nozzle head -->
  <rect x="50" y="26.5" width="4" height="2.5" rx="1" fill="white"/>
  <!-- Base -->
  <rect x="38" y="37.5" width="13" height="2.5" rx="1" fill="white" fill-opacity="0.6"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" stroke="#0B132B" stroke-width="1.5" fill="none"/>
  <!-- Centre divider -->
  <line x1="32" y1="2" x2="32" y2="62" stroke="white" stroke-width="1.5" stroke-opacity="0.45"/>
